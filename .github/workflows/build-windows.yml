name: Build VibeDLNA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Test and publish
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            .\build-release.ps1 -Version $env:GITHUB_REF_NAME
          } else {
            .\build-release.ps1
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VibeDLNA-windows
          path: |
            artifacts/publish/VibeDLNA.exe
            artifacts/installer/VibeDLNA-Setup-*.exe
            artifacts/release/VibeDLNA-windows.zip
            artifacts/release/VibeDLNA-windows.zip.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: VibeDLNA-windows
          path: release-assets

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath "release-assets" -Recurse -File | Where-Object {
            $_.Name -match '^(VibeDLNA-windows\.zip|VibeDLNA-windows\.zip\.sha256|VibeDLNA-Setup-.*\.exe)$'
          })
          if ($assets.Count -eq 0) {
            throw "No se encontraron paquetes para publicar."
          }

          $arguments = @(
            "release", "create", $env:GITHUB_REF_NAME,
            "--repo", "SPxMM3R1/VibeDLNA",
            "--title", "VibeDLNA $env:GITHUB_REF_NAME",
            "--generate-notes"
          )
          $arguments += $assets.FullName
          gh @arguments
